version: 2

# auth-kit (backend/package.json) is a private git dependency. Dependabot reads
# it with the read-only fine-grained token stored as a **Dependabot** secret
# named AUTH_KIT_READ_TOKEN (Absence0760/auth-kit#2; the same token is also an
# Actions secret, for CI).
registries:
  github-auth-kit:
    type: git
    url: https://github.com
    username: x-access-token
    password: ${{secrets.AUTH_KIT_READ_TOKEN}}

updates:
  # GitHub Actions used in workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]

  # Adjust or duplicate these per template's actual ecosystems.
  # Each template branch should leave the ones it needs and remove the rest.
  - package-ecosystem: npm
    directory: "/"
    registries:
      - github-auth-kit
    schedule:
      interval: weekly
    # Wait 7 days after a release before proposing it (most malicious releases
    # are found and pulled within days); security updates are exempt. auth-kit
    # is ours and its tags carry security fixes, so it is never held back.
    cooldown:
      default-days: 7
      exclude:
        - "@absence0760/auth-kit"
    # The frontend stays on TypeScript 6 until svelte-kit sync and svelte-check
    # support 7 (docs/STACK.md; sveltejs/kit#17537, sveltejs/language-tools#3063),
    # so no major TypeScript bump is proposed. The other workspaces are already
    # on 7; drop this once the frontend moves.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
        # auth-kit gets its own PR, which dependabot-auto-merge.yml never merges.
        exclude-patterns: ["@absence0760/auth-kit"]

  - package-ecosystem: terraform
    directory: "/infra"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
