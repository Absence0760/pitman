name: Deploy backend

# Builds the API Lambda bundle and replaces the function's code
# (docs/deployment.md). Terraform owns the function's configuration (memory,
# timeout, concurrency, env); this workflow only ever changes its code.
#
# Inert until the operator wires CI (docs/deployment.md § First deploy):
# every job is skipped (grey, not red) while the repo variables below are
# unset. The deploy job is gated on `environment: production` (required
# reviewer; the deploy role's trust policy pins that environment's OIDC
# `sub`), and only that job may mint an OIDC token.
#
# Repo variables (set by templates/scripts/export-tf-vars.sh from the
# Terraform outputs): AWS_DEPLOY_ROLE_ARN, AWS_REGION, LAMBDA_FUNCTION_NAME,
# PUBLIC_SITE_URL (for the smoke check).

# When it runs: only after CI has passed on the commit. It triggers on
# `workflow_run` of CI, and the gate job requires that run to have succeeded,
# on a push (not a pull request, not a fork) to main; it then checks out
# exactly the commit CI tested (workflow_run.head_sha). The gate
# (scripts/deploy/deploy-gate.mjs) deploys only when a file under
# DEPLOY_PATHS changed since the commit the last successful deploy job
# shipped, which each run records in its run-name; so a burst of pushes, a
# CI run cancelled by a newer push, or a rejected approval never drops a
# change. A manual run (`gh workflow run deploy-backend.yml`) always deploys, but
# only from main and only a commit with a successful CI run.
# docs/deployment.md § How a deploy happens.

run-name: Deploy backend ${{ github.event.workflow_run.head_sha || github.sha }}

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    name: Decide whether to deploy
    if: >-
      vars.AWS_DEPLOY_ROLE_ARN != '' && vars.AWS_REGION != '' && vars.LAMBDA_FUNCTION_NAME != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # this workflow's earlier runs and CI's runs
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - name: Checkout the commit CI passed
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Decide
        id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          REF: ${{ github.ref }}
          WORKFLOW_FILE: deploy-backend.yml
          DEPLOY_JOB: Update Lambda code
          CI_WORKFLOW: ci.yml
          DEPLOY_PATHS: |
            backend
            packages/wrsm
            pnpm-lock.yaml
            pnpm-workspace.yaml
            .github/workflows/deploy-backend.yml
        run: node scripts/deploy/deploy-gate.mjs

  build:
    name: Build Lambda bundle
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No `cache: pnpm`: the pnpm store holds the private auth-kit, and a
          # fork's pull request can restore base-branch caches once the repo is
          # public (docs/deployment.md § Sign-in; workflows.test.mjs guards it).

      # auth-kit is a private git dependency (backend/package.json), fetched with a
      # fine-grained, read-only token for that one repo (Absence0760/auth-kit#2).
      # Missing, the job fails here with the setup link instead of at an opaque
      # clone error. The token itself goes only to the install step below.
      - name: Check the auth-kit read token is set
        env:
          AUTH_KIT_READ_TOKEN: ${{ secrets.AUTH_KIT_READ_TOKEN }}
        run: |
          if [ -z "$AUTH_KIT_READ_TOKEN" ]; then
            echo "::error::AUTH_KIT_READ_TOKEN is not set, so CI can't fetch the private auth-kit. Operator setup: https://github.com/Absence0760/auth-kit/issues/2"
            exit 1
          fi

      - name: Install dependencies
        # The token reaches git for this step only, as environment-only config
        # (GIT_CONFIG_*) that rewrites auth-kit's URLs alone: nothing is written
        # to ~/.gitconfig, so no later step (tests, builds, deploys) can read it.
        env:
          GIT_CONFIG_COUNT: '3'
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.AUTH_KIT_READ_TOKEN }}@github.com/Absence0760/auth-kit.insteadOf
          GIT_CONFIG_VALUE_0: ssh://git@github.com/Absence0760/auth-kit
          GIT_CONFIG_KEY_1: url.https://x-access-token:${{ secrets.AUTH_KIT_READ_TOKEN }}@github.com/Absence0760/auth-kit.insteadOf
          GIT_CONFIG_VALUE_1: git@github.com:Absence0760/auth-kit
          GIT_CONFIG_KEY_2: url.https://x-access-token:${{ secrets.AUTH_KIT_READ_TOKEN }}@github.com/Absence0760/auth-kit.insteadOf
          GIT_CONFIG_VALUE_2: https://github.com/Absence0760/auth-kit
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: backend
        run: pnpm check

      - name: Build Lambda bundle
        working-directory: backend
        run: pnpm build

      - name: Package Lambda zip
        working-directory: backend/dist
        run: |
          zip -9 lambda.zip lambda.mjs
          ls -lh lambda.zip

      - name: Upload bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lambda-zip
          path: backend/dist/lambda.zip
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Update Lambda code
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write # OIDC, this job only
    steps:
      - name: Download bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lambda-zip

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: deploy-backend-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      # No --publish: nothing uses versions or aliases, and each published
      # version would keep its code in the account's code storage forever.
      - name: Update Lambda function code
        env:
          FUNCTION: ${{ vars.LAMBDA_FUNCTION_NAME }}
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION" \
            --zip-file "fileb://lambda.zip" \
            --query 'LastUpdateStatus' --output text
          aws lambda wait function-updated --function-name "$FUNCTION"

      # Through CloudFront, so it proves the whole path: DNS, certificate, the
      # /api prefix strip, the shared secret and the app.
      - name: Smoke check /api/health
        if: vars.PUBLIC_SITE_URL != ''
        env:
          SITE: ${{ vars.PUBLIC_SITE_URL }}
        run: curl -fsS "${SITE}/api/health"
