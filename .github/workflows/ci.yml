name: CI

# Keep `paths-ignore` the exact inverse of ci-gate-docs.yml's `paths` so the
# required "CI gate" check is always reported (docs/USING.md "The CI gate").
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test and typecheck
    runs-on: ubuntu-latest

    # DynamoDB Local, so the sign-in races run against the real store
    # (backend/src/auth/dynamo.test.ts; it skips only when DYNAMODB_ENDPOINT
    # is unset). The image and digest docker-compose.yml and auth-kit's CI use.
    services:
      dynamodb:
        image: amazon/dynamodb-local:3.3.2@sha256:6ada631ec7aa5fc83446855eb17233e3dad184fec47477e8140c6c569cfe0c86
        ports:
          - 8000:8000

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      # auth-kit is a private git dependency (backend/package.json). A fine-grained,
      # read-only token for that one repo (Absence0760/auth-kit#2) is passed through
      # env only, and rewrites only auth-kit's URLs for this job's git. Missing, the
      # job fails here with the setup link instead of at an opaque clone error.
      - name: Give git read access to the private auth-kit
        env:
          AUTH_KIT_READ_TOKEN: ${{ secrets.AUTH_KIT_READ_TOKEN }}
        run: |
          if [ -z "$AUTH_KIT_READ_TOKEN" ]; then
            echo "::error::AUTH_KIT_READ_TOKEN is not set, so CI can't fetch the private auth-kit. Operator setup: https://github.com/Absence0760/auth-kit/issues/2"
            exit 1
          fi
          for from in "ssh://git@github.com/Absence0760/auth-kit" "git@github.com:Absence0760/auth-kit" "https://github.com/Absence0760/auth-kit"; do
            git config --global --add url."https://x-access-token:${AUTH_KIT_READ_TOKEN}@github.com/Absence0760/auth-kit".insteadOf "$from"
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm check` / `pnpm test` recurse into every workspace in
      # pnpm-workspace.yaml, including the engine packages under packages/*
      # (@pitman/wrsm, @pitman/wrsm-cli). The frontend typechecks from its
      # committed .env.development, so no .env seeding is needed.
      - name: Typecheck all workspaces
        run: pnpm check

      - name: Run tests
        env:
          DYNAMODB_ENDPOINT: http://127.0.0.1:8000
        run: pnpm test

      - name: Run repo tool tests (coverage summary, CSP check, CloudFront functions)
        run: pnpm test:tools

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      # auth-kit is a private git dependency (backend/package.json). A fine-grained,
      # read-only token for that one repo (Absence0760/auth-kit#2) is passed through
      # env only, and rewrites only auth-kit's URLs for this job's git. Missing, the
      # job fails here with the setup link instead of at an opaque clone error.
      - name: Give git read access to the private auth-kit
        env:
          AUTH_KIT_READ_TOKEN: ${{ secrets.AUTH_KIT_READ_TOKEN }}
        run: |
          if [ -z "$AUTH_KIT_READ_TOKEN" ]; then
            echo "::error::AUTH_KIT_READ_TOKEN is not set, so CI can't fetch the private auth-kit. Operator setup: https://github.com/Absence0760/auth-kit/issues/2"
            exit 1
          fi
          for from in "ssh://git@github.com/Absence0760/auth-kit" "git@github.com:Absence0760/auth-kit" "https://github.com/Absence0760/auth-kit"; do
            git config --global --add url."https://x-access-token:${AUTH_KIT_READ_TOKEN}@github.com/Absence0760/auth-kit".insteadOf "$from"
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm --filter @pitman/frontend exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm test:frontend:e2e

  # Single required status check for branch protection (docs/USING.md
  # "The CI gate"). It fans in on every job above via `needs` + always(),
  # failing the merge if any upstream job did not succeed (a skipped job
  # counts as passing, matching GitHub's required-check semantics).
  #
  # Add each new job's id to `needs` below — that is the only edit needed
  # to gate merges on it; the branch-protection config never changes.
  # Pair with ci-gate-docs.yml (base-owned) so docs-only PRs still report
  # a passing "CI gate".
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    if: always()
    needs: [test, e2e]
    steps:
      - name: Require every upstream job to have passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          bad=$(echo "$NEEDS_JSON" | jq -r \
            'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"')
          if [ -n "$bad" ]; then
            echo "::error::CI gate failing — upstream jobs did not pass:"
            echo "$bad"
            exit 1
          fi
          echo "All upstream jobs passed."
