name: CI

# Always runs on pull_request, with no paths-ignore: a docs-only PR (docs/,
# .claude/, *.md) skips the heavy jobs through the `changes` job instead, so
# the required "CI gate" is always reported by this workflow and the
# `claude-tooling` guard still runs on exactly the PRs that can break it
# (the same split as project-water-management's ci.yml; there is no
# ci-gate-docs.yml, see .github/template-sync-ignore).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Classifies the diff; the heavy jobs run only when `code == 'true'`. Only a
  # pull request may skip them: a push to main (or a manual run) always runs
  # the full suite, because main's deploys follow it.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        name: Anything besides docs changed?
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -qvE '^(docs/|\.claude/)|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test and typecheck
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    # DynamoDB Local, so the sign-in races run against the real store
    # (backend/src/auth/dynamo.test.ts; it skips only when DYNAMODB_ENDPOINT
    # is unset). The image and digest docker-compose.yml and auth-kit's CI use.
    services:
      dynamodb:
        image: amazon/dynamodb-local:3.3.2@sha256:6ada631ec7aa5fc83446855eb17233e3dad184fec47477e8140c6c569cfe0c86
        ports:
          - 8000:8000

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # auth-kit is a private git dependency (backend/package.json), fetched with a
      # fine-grained, read-only token for that one repo (Absence0760/auth-kit#2).
      # Missing, the job fails here with the setup link instead of at an opaque
      # clone error. The token itself goes only to the install step below.
      - name: Check the auth-kit read token is set
        env:
          AUTH_KIT_READ_TOKEN: ${{ secrets.AUTH_KIT_READ_TOKEN }}
        run: |
          if [ -z "$AUTH_KIT_READ_TOKEN" ]; then
            echo "::error::AUTH_KIT_READ_TOKEN is not set, so CI can't fetch the private auth-kit. Operator setup: https://github.com/Absence0760/auth-kit/issues/2"
            exit 1
          fi

      - name: Install dependencies
        # The token reaches git for this step only, as environment-only config
        # (GIT_CONFIG_*) that rewrites auth-kit's URLs alone: nothing is written
        # to ~/.gitconfig, so no later step (tests, builds, deploys) can read it.
        env:
          GIT_CONFIG_COUNT: '3'
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.AUTH_KIT_READ_TOKEN }}@github.com/Absence0760/auth-kit.insteadOf
          GIT_CONFIG_VALUE_0: ssh://git@github.com/Absence0760/auth-kit
          GIT_CONFIG_KEY_1: url.https://x-access-token:${{ secrets.AUTH_KIT_READ_TOKEN }}@github.com/Absence0760/auth-kit.insteadOf
          GIT_CONFIG_VALUE_1: git@github.com:Absence0760/auth-kit
          GIT_CONFIG_KEY_2: url.https://x-access-token:${{ secrets.AUTH_KIT_READ_TOKEN }}@github.com/Absence0760/auth-kit.insteadOf
          GIT_CONFIG_VALUE_2: https://github.com/Absence0760/auth-kit
        run: pnpm install --frozen-lockfile

      # `pnpm check` / `pnpm test` recurse into every workspace in
      # pnpm-workspace.yaml, including the engine packages under packages/*
      # (@pitman/wrsm, @pitman/wrsm-cli). The frontend typechecks from its
      # committed .env.development, so no .env seeding is needed.
      - name: Typecheck all workspaces
        run: pnpm check

      - name: Run tests
        env:
          DYNAMODB_ENDPOINT: http://127.0.0.1:8000
        run: pnpm test

      - name: Run repo tool tests (root-scripts guard, CI guards, coverage summary, CSP check, CloudFront functions)
        run: pnpm test:tools

  e2e:
    name: End-to-end (Playwright)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # auth-kit is a private git dependency (backend/package.json), fetched with a
      # fine-grained, read-only token for that one repo (Absence0760/auth-kit#2).
      # Missing, the job fails here with the setup link instead of at an opaque
      # clone error. The token itself goes only to the install step below.
      - name: Check the auth-kit read token is set
        env:
          AUTH_KIT_READ_TOKEN: ${{ secrets.AUTH_KIT_READ_TOKEN }}
        run: |
          if [ -z "$AUTH_KIT_READ_TOKEN" ]; then
            echo "::error::AUTH_KIT_READ_TOKEN is not set, so CI can't fetch the private auth-kit. Operator setup: https://github.com/Absence0760/auth-kit/issues/2"
            exit 1
          fi

      - name: Install dependencies
        # The token reaches git for this step only, as environment-only config
        # (GIT_CONFIG_*) that rewrites auth-kit's URLs alone: nothing is written
        # to ~/.gitconfig, so no later step (tests, builds, deploys) can read it.
        env:
          GIT_CONFIG_COUNT: '3'
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ secrets.AUTH_KIT_READ_TOKEN }}@github.com/Absence0760/auth-kit.insteadOf
          GIT_CONFIG_VALUE_0: ssh://git@github.com/Absence0760/auth-kit
          GIT_CONFIG_KEY_1: url.https://x-access-token:${{ secrets.AUTH_KIT_READ_TOKEN }}@github.com/Absence0760/auth-kit.insteadOf
          GIT_CONFIG_VALUE_1: git@github.com:Absence0760/auth-kit
          GIT_CONFIG_KEY_2: url.https://x-access-token:${{ secrets.AUTH_KIT_READ_TOKEN }}@github.com/Absence0760/auth-kit.insteadOf
          GIT_CONFIG_VALUE_2: https://github.com/Absence0760/auth-kit
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm --filter @pitman/frontend exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm test:frontend:e2e

  # Every relative markdown link resolves, file and heading
  # (scripts/ci-guards/check_doc_links.mjs). Needs only Node and the
  # checkout, no install. No `changes` gate: a docs-only PR is exactly the
  # one that can break a link.
  doc-links:
    name: Doc links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check every relative markdown link resolves
        run: node scripts/ci-guards/check_doc_links.mjs

  # The committed .env.development files stay local-only: local hosts, reserved mail domains, dev-only- keys,
  # local data sources, PUBLIC_* in the frontend, no sops / tfvars / other env file tracked
  # (scripts/ci-guards/env-isolation.mjs, docs/security.md § Secrets management). Needs no install, so no
  # auth-kit token. It never prints a value, only the file, line and rule.
  env-isolation:
    name: Env isolation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Guard unit tests
        run: node --test scripts/ci-guards/env-isolation.test.mjs

      - name: Check the committed env files (pnpm check:env)
        run: node scripts/ci-guards/env-isolation.mjs

  # The Claude agents, commands and skills cite only paths that exist and
  # carry no template placeholders (scripts/ci-guards/check_claude_tooling.mjs,
  # `pnpm check:claude`). No `changes` gate: a PR that only touches .claude/
  # or docs is exactly the one that can break it. Plain node, no install.
  claude-tooling:
    name: Claude tooling (agents and commands)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Agents and commands match the repo
        run: node scripts/ci-guards/check_claude_tooling.mjs

  # Single required status check for branch protection (templates
  # docs/USING.md "The CI gate"). It fans in on every job above via `needs` +
  # always(), failing the merge if any upstream job did not succeed (a
  # skipped job counts as passing, matching GitHub's required-check
  # semantics: on a docs-only PR `test` and `e2e` skip, and `doc-links`,
  # `env-isolation` and `claude-tooling` decide).
  #
  # Add each new job's id to `needs` below — that is the only edit needed
  # to gate merges on it; the branch-protection config never changes.
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    if: always()
    needs: [changes, test, e2e, doc-links, env-isolation, claude-tooling]
    steps:
      - name: Require every upstream job to have passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          bad=$(echo "$NEEDS_JSON" | jq -r \
            'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"')
          if [ -n "$bad" ]; then
            echo "::error::CI gate failing — upstream jobs did not pass:"
            echo "$bad"
            exit 1
          fi
          echo "All upstream jobs passed."
