name: Coverage

# Which code no test reaches (docs/STACK.md § Commands, `pnpm test:coverage`).
# A report, never a gate: no threshold, and it isn't in ci.yml. Weekly, by
# hand, and on a change to the coverage setup itself. Writes its table to the
# run's summary and uploads the HTML reports. Adapted from IC-WBT's
# coverage.yml (estate pattern); Pitman has no DB tests, so one job.
#
# The reference comparison (WRSM_REFERENCE_DIR) skips here, as in every CI
# run: the reference network never leaves the operator's machine, so the
# engine's figure is its synthetic-fixture tests alone.
on:
  schedule:
    # 06:30 UTC every Monday, beside the dependency audit (audit.yml).
    - cron: '30 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/coverage.yml
      - scripts/coverage-report/**
      - '**/vitest.config.ts'
  push:
    branches: [main]
    paths:
      - .github/workflows/coverage.yml
      - scripts/coverage-report/**
      - '**/vitest.config.ts'

permissions:
  contents: read

jobs:
  unit:
    name: Unit coverage (engine, CLI, backend, frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No `packageManager` field in package.json, so the version is named
      # here, matching ci.yml.
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Coverage summary script tests
        run: pnpm test:tools

      # Each workspace's test:coverage, then the summary table (the frontend's
      # script runs svelte-kit sync first).
      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Summary
        run: node scripts/coverage-report/summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-unit
          path: |
            packages/wrsm/coverage/
            packages/wrsm-cli/coverage/
            backend/coverage/
            frontend/coverage/
          retention-days: 14
