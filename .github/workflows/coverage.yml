name: Coverage

# Which code no test reaches (docs/STACK.md § Commands, `pnpm test:coverage`).
# A report, never a gate: no threshold, and it isn't in ci.yml. Weekly, by
# hand, and on a change to the coverage setup itself. Writes its table to the
# run's summary and uploads the HTML reports. Adapted from IC-WBT's
# coverage.yml (estate pattern); Pitman has no DB tests, so one job.
#
# The reference comparison (WRSM_REFERENCE_DIR) skips here, as in every CI
# run: the reference network never leaves the operator's machine, so the
# engine's figure is its synthetic-fixture tests alone.
on:
  schedule:
    # 06:30 UTC every Monday, beside the dependency audit (audit.yml).
    - cron: '30 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/coverage.yml
      - scripts/coverage-report/**
      - '**/vitest.config.ts'
  push:
    branches: [main]
    paths:
      - .github/workflows/coverage.yml
      - scripts/coverage-report/**
      - '**/vitest.config.ts'

permissions:
  contents: read

jobs:
  unit:
    name: Unit coverage (engine, CLI, backend, frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No `packageManager` field in package.json, so the version is named
      # here, matching ci.yml.
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # auth-kit is a private git dependency (backend/package.json). A fine-grained,
      # read-only token for that one repo (Absence0760/auth-kit#2) is passed through
      # env only, and rewrites only auth-kit's URLs for this job's git. Missing, the
      # job fails here with the setup link instead of at an opaque clone error.
      - name: Give git read access to the private auth-kit
        env:
          AUTH_KIT_READ_TOKEN: ${{ secrets.AUTH_KIT_READ_TOKEN }}
        run: |
          if [ -z "$AUTH_KIT_READ_TOKEN" ]; then
            echo "::error::AUTH_KIT_READ_TOKEN is not set, so CI can't fetch the private auth-kit. Operator setup: https://github.com/Absence0760/auth-kit/issues/2"
            exit 1
          fi
          for from in "ssh://git@github.com/Absence0760/auth-kit" "git@github.com:Absence0760/auth-kit" "https://github.com/Absence0760/auth-kit"; do
            git config --global --add url."https://x-access-token:${AUTH_KIT_READ_TOKEN}@github.com/Absence0760/auth-kit".insteadOf "$from"
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Coverage summary script tests
        run: pnpm test:tools

      # Each workspace's test:coverage, then the summary table (the frontend's
      # script runs svelte-kit sync first).
      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Summary
        run: node scripts/coverage-report/summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-unit
          path: |
            packages/wrsm/coverage/
            packages/wrsm-cli/coverage/
            backend/coverage/
            frontend/coverage/
          retention-days: 14
