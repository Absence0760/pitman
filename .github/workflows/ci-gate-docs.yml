# Companion to the `CI gate` job in this repo's ci.yml. That gate is the
# single required status check on `main`, but the main CI workflow is
# skipped wholesale on docs-only / *.md / .claude-only PRs (its
# `paths-ignore`), which would leave the required "CI gate" context
# pending forever and block those PRs from merging. This workflow
# triggers on exactly the inverse path set and reports an identically
# named "CI gate" context as passing, so the required check is always
# satisfied.
#
# A PR that touches both code and docs triggers both workflows; both emit
# a "CI gate" check and GitHub requires all of them green — the real gate
# in ci.yml still does the gating, this one passes trivially.
#
# Pitman adds one real job here: `doc-links` (the same job as in ci.yml),
# because a docs-only change is exactly the change that breaks a doc link.
# The gate below waits on it, so this gate is no longer trivially green.
# A base sync that drops the job fails `pnpm test:tools`
# (scripts/ci-guards/check_doc_links.test.mjs).
#
# This file is base-owned (propagated by sync-base.sh). Keep the job name
# "CI gate" in lock-step with the ci-gate job in ci.yml, and keep the
# paths here as the exact inverse of ci.yml's `paths-ignore`.
name: CI gate (docs)

on:
  # Deliberately NOT filtered to `branches: [main]`. A stacked PR — one based
  # on another feature branch — matches no base-branch filter and so runs
  # nothing, leaving the required "CI gate" context unreported while the PR
  # still shows green from whatever workflows have no filter. project-running
  # keeps a security guard that fails the build on exactly this
  # (`no PR-triggered workflow is scoped to a base branch`); this file used to
  # trip it the moment it was synced in.
  pull_request:
    paths:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'

permissions:
  contents: read

jobs:
  doc-links:
    name: Doc links
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check every relative markdown link resolves
        run: node scripts/ci-guards/check_doc_links.mjs

  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [doc-links]
    steps:
      - name: Docs-only change — heavy CI skipped, doc links checked, gate passes
        run: echo "Docs-only PR; ci.yml skipped by paths-ignore and the doc links resolve. CI gate passes."
